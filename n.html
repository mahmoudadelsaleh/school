<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>البحث عن الرقم القومي</title>
    <!-- لا حاجة لمكتبة SheetJS الآن لأن البيانات مدمجة -->
    <style>
        * { box-sizing: border-box; }
        body, html {
            margin: 0; padding: 0;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
            background-color: #e5e7eb;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh; 
            max-width: 600px;
            margin: 0 auto;
            background: #111827; 
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            color: #ffffff;
        }
        .header {
            background: linear-gradient(135deg, #d4af37, #f3e5ab, #d4af37);
            color: #111827;
            text-align: center;
            padding: 18px;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: 1px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 16px;
            font-size: 16px;
            background: #f3f4f6;
            color: #111827;
            border: 2px solid #9ca3af;
            border-radius: 10px;
            margin-bottom: 12px;
            outline: none;
            font-weight: bold;
            transition: 0.3s;
        }
        input[type="text"]:focus { 
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.5);
        }
        button.primary-btn {
            background: linear-gradient(to right, #d4af37, #b8860b);
            color: #111827;
            border: none;
            padding: 16px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 900;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        button.primary-btn:active { transform: scale(0.98); }

        .result-container {
            margin-top: 20px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            padding: 15px;
            min-height: 100px;
            max-height: 350px; 
            overflow-y: auto;
        }
        
        .match-group {
            background: #273343;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #4b5563;
        }
        .match-group:last-child { margin-bottom: 0; }
        
        .name-card {
            background: #e5e7eb; 
            color: #111827;
            padding: 12px 15px;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 10px;
            border-right: 5px solid #111827;
        }
        .id-card {
            background: #111827; 
            color: #d4af37; 
            padding: 15px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: 900;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 15px;
            border: 1px solid #d4af37;
            box-shadow: inset 0 0 10px rgba(212, 175, 55, 0.1);
        }
        .copy-btn {
            width: 100%;
            background: #374151; 
            color: #e5e7eb; 
            border: 1px solid #4b5563;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: 0.3s;
        }
        .copy-btn:hover { background: #4b5563; }
        .copy-btn.copied {
            background: #10b981; 
            color: white;
            border-color: #059669;
        }

        .status-msg {
            text-align: center;
            color: #9ca3af;
            font-size: 16px;
            margin: auto 0;
        }
        .file-status {
            font-size: 14px;
            color: #10b981;
            text-align: center;
            margin-bottom: 15px;
            font-weight: bold;
        }
        
        /* إخفاء منطقة البيانات تماماً */
        #dataInput {
            display: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">البحث عن الرقم القومي</div>
    
    <div class="content">
        <div id="fileStatusMsg" class="file-status">✅ البيانات مدمجة وجاهزة للبحث السريع</div>
        
        <div>
            <input type="text" id="searchInput" placeholder="أدخل جزء من الاسم للبحث..." onkeyup="if(event.key === 'Enter') searchName()">
            <button class="primary-btn" onclick="searchName()" style="width: 100%;">بحث سريع</button>
            <div class="result-container" id="resultBox">
                <div class="status-msg">أدخل الاسم واضغط بحث...</div>
            </div>
        </div>

        <!-- البيانات مدمجة هنا مباشرة ومخفية عن المستخدم -->
        <textarea id="dataInput">
1	عزة عثمان إسماعيل العشماوى	27202071801903	1343-21	101213
2	سوزان عطيه عبد العزيز محمد	26810120200186	1344-21	101213
3	مصطفى كامل علي الطنطاوي	27111301801074	1345-21	101213
4	عزة عطيه عبده بسيوني	27206241801283	1346-21	101213
        </textarea>
    </div>
</div>

<script>
    let records = [];

    // قراءة البيانات من النص المدمج في الصفحة
    function parseData() {
        const text = document.getElementById('dataInput').value.trim();
        const lines = text.split('\n');
        records = [];
        
        lines.forEach((line, index) => {
            if (!line.trim()) return;
            if (line.includes("الرقم القومى") && index === 0) return;

            let name = "";
            let id = "";

            let parts = line.split('\t');
            if (parts.length >= 2) {
                let idIndex = parts.findIndex(p => /\d{14}/.test(p));
                if (idIndex !== -1) {
                    let extractedId = parts[idIndex].match(/\d{14}/);
                    if (extractedId) {
                        id = extractedId[0];
                        if (idIndex > 0) name = parts[idIndex - 1].trim();
                        else if (parts.length > idIndex + 1) name = parts[idIndex + 1].trim();
                    }
                }
            } 
            
            // احتياطي للملصق بدون مسافات
            if (!name || !id) {
                const match = line.match(/(?:\d+)?\s*([أ-يa-zA-Z\s]+?)\s*(\d{14})/);
                if (match) {
                    name = match[1].trim();
                    id = match[2];
                }
            }

            if (name && id) {
                name = name.replace(/^\d+/, '').trim();
                name = name.replace(/[0-9\-]/g, '').trim(); 
                if (!records.find(r => r.id === id)) {
                    records.push({ name: name, id: id });
                }
            }
        });
    }

    // البحث في السجلات
    function searchName() {
        const query = document.getElementById('searchInput').value.trim();
        const resultBox = document.getElementById('resultBox');
        
        if (!query) {
            resultBox.innerHTML = '<div class="status-msg">الرجاء إدخال اسم للبحث</div>';
            return;
        }
        
        const matches = records.filter(r => r.name.includes(query));
        
        if (matches.length === 0) {
            resultBox.innerHTML = '<div class="status-msg" style="color: #ef4444;">لم يتم العثور على نتائج.</div>';
        } else {
            let html = '';
            matches.forEach((m, i) => {
                html += `
                    <div class="match-group">
                        <div class="name-card">👤 ${m.name}</div>
                        <div class="id-card" id="id-val-${i}">${m.id}</div>
                        <button class="copy-btn" id="copy-btn-${i}" onclick="copyID('${m.id}', 'copy-btn-${i}')">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-left: 8px;"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
                            نسخ الرقم القومي
                        </button>
                    </div>
                `;
            });
            resultBox.innerHTML = html;
        }
    }

    // وظيفة النسخ
    function copyID(text, btnId) {
        navigator.clipboard.writeText(text).then(() => {
            const btn = document.getElementById(btnId);
            const originalHtml = btn.innerHTML;
            btn.classList.add('copied');
            btn.innerHTML = '✅ تم النسخ بنجاح!';
            setTimeout(() => {
                btn.classList.remove('copied');
                btn.innerHTML = originalHtml;
            }, 2000);
        }).catch(err => {
            alert("حدث خطأ أثناء النسخ");
        });
    }

    // تجهيز البيانات فور تحميل الصفحة
    window.addEventListener('DOMContentLoaded', () => {
        parseData();
    });

</script>

</body>
</html>
